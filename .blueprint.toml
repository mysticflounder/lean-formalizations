[project]
name = "lean-formalizations"
slug = "lean-formalizations"

[paths]
db       = "data/proof-blueprint.db"
# srcDir of the LeanFormalizations lake_lib. The Lake package root (lakefile +
# .lake) is auto-detected by walking up from here, so this points at the source
# root, not the repo root.
lean_lib = "lean"

[publish]
# Multi-theorem library — no single target_symbol.
# Set per-session when gating a specific result:
#   target_symbol = "Finset.balog_szemeredi_gowers_symmetric"
state = "wip"

[axioms]
# Full FQ names of deliberately approved non-core axioms.
# Core axioms (propext, Classical.choice, Quot.sound, Lean.ofReduceBool,
# Lean.ofReduceNat) are always approved; do not list them here.
approved = []
