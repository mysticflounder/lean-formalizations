# formalization.yaml (v0.3): per-formalization metadata for one member of the
# lean-formalizations collection. Split out of the repo-root formalization.yaml so
# this formalization can be registered as its own entry.
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.
#
# Markers below ({{NEEDS_ADAM_INPUT}}) flag values that only the project owner can
# fill - per-entry cost figures. The canonical repo URL and the source attribution
# were both settled on 2026-08-31 and are no longer marked. Do not treat a marker as
# a fact.

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "lean-formalizations/PlanarMaps"                    # [required]
  authors: ["Adam McKenna"]                         # [required]
  license: "Apache-2.0"                             # [required]
  repo: "https://github.com/mysticflounder/lean-formalizations"  # verified against the configured git remote, 2026-08-31
  subproject: "PlanarMaps"
  subproject_note: >
    The combinatorial-map / planar edge-bound cluster of the lean-formalizations
    collection: 6 of the 53 mathlib-only headline claims packaged across the nine
    per-formalization comparator configurations.

# classification - for registry indexing. arXiv categories and MSC 2020 codes chosen
# to fit this entry's mathematics; short lists are deliberate (no padding).
arxiv_categories: ["math.CO"]
msc2020: ["05C10", "05C40"]

# sources - what was formalized.
# The repo-root formalization.yaml attributes no source to this cluster. The entries
# below record what README.md records, and no citation is invented: the mathematical
# content is classical, and the model definition has a textbook source.
sources:                                            # [required]
  - title: "Euler's formula and the planar edge bound e ≤ 3v − 6: classical, no originating paper asserted"
    authors: []
    id: null
    type: "folklore"
    note: >
      Euler characteristic ≤ 2 for a connected map, the simple-graph edge bound
      e ≤ 3v − 6, its multiplicity lift e ≤ M·(3v − 6), and preservation of planarity
      and connectivity under duality are textbook facts. No single originating paper is
      asserted for them.
  - title: "Graphs on Surfaces and Their Applications (source of the dart-permutation model used as the definition)"
    authors: ["Sergei K. Lando", "Alexander K. Zvonkin"]
    id: "Encyclopaedia of Mathematical Sciences 141, Springer, 2004; DOI 10.1007/978-3-540-38361-1"
    type: "book"
    note: >
      §1.3.3 "Maps: Permutational Model" introduces the dart set and the permutations
      σ/α/ϕ; the formal combinatorial-map definition followed here is Def. 1.3.23.
      This is the source of the definition, not of the six gated theorems.
  - title: "A crossing lemma for multigraphs — the consuming program, recorded as context only"
    authors: ["János Pach", "Géza Tóth"]
    id: "arXiv:1801.00721; Discrete Comput. Geom. 63 (2020) 918–933; DOI 10.1007/s00454-018-00052-z"
    type: "preprint"
    relation: "consumes, does not originate"
    note: >
      README.md heads this module with this paper because the multigraph crossing-lemma
      program CONSUMES the multiplicity edge bound. Checked against the paper's full
      text: its Lemma 2.1 states e ≤ 3n − 6 for a branching topological multigraph with
      n ≥ 3 vertices in which no two edges cross, and its proof is the same textbook
      count (2e as the sum of face sizes, each face at least 3, then Euler) presented
      as known material. The paper contains NO bound of the form e ≤ m(3n − 6); the
      only multiplicity-m bound in it is Székely's crossing bound. So this paper
      restates one of the six in a drawing setting and originates none of them. It is
      recorded here as context and must not be promoted to this entry's source.

# project status
status:
  scope: >
    Combinatorial maps in the dart-permutation model and the planar edge bound.
    A combinatorial map on a finite dart set D is three permutations of D
    (vertexPerm / edgePerm / facePerm) with facePerm * edgePerm * vertexPerm = 1 and
    edgePerm a fixed-point-free involution; cells are the permutation cycles, counted
    with Nat.card; planarity is Euler = 2, connectivity is Relation.ReflTransGen,
    simplicity is no-loop plus no-parallel on dart-level endpoint pairs. Gated results:
    a connected map has Euler characteristic ≤ 2; the simple planar edge bound
    e ≤ 3v − 6 and its multiplicity lift e ≤ M·(3v − 6); and preservation of planarity
    and of connectivity in both directions under duality. mathlib-only dependencies:
    no project axioms, no custom axiom, no native_decide, no sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  axioms_note: >
    #print axioms closure of each of the 6 gated results is a subset of
    {propext, Classical.choice, Quot.sound}. The repository's 8 open `sorry`
    declarations are all in the separate Pach–Sharir / Szemerédi–Trotter incidence
    route; none of them is in this formalization or reachable from it.
  theorems:
    - "Headline.eulerCharacteristic_le_two"
    - "Headline.card_edge_le_three_card_vertex_sub_six"
    - "Headline.dual_isPlanar_iff"
    - "Headline.dual_connected_iff"
    - "Headline.connected_dual_iff"
    - "Headline.planar_multigraph_edge_bound"
  main_results:
  - declaration: "6 mathlib-only headline claims (see status.theorems)"
    file: "comparator/PlanarMaps/Solution.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/PlanarMaps/config.json"
    literature_dependencies: []
  - declaration: "CombinatorialMap.eulerCharacteristic_le_two"
    file: "lean/LeanFormalizations/Combinatorics/CombinatorialMap/EulerBound.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/PlanarMaps/config.json"
  - declaration: "CombinatorialMap.card_edge_le_three_card_vertex_sub_six, planar_multigraph_edge_bound"
    file: "lean/LeanFormalizations/Combinatorics/CombinatorialMap/PlanarEdgeBound.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/PlanarMaps/config.json"
  - declaration: "CombinatorialMap.dual_isPlanar_iff, dual_connected_iff, connected_dual_iff"
    file: "lean/LeanFormalizations/Combinatorics/CombinatorialMap/DualProperties.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/PlanarMaps/config.json"
  gate_note: >
    The artifacts this entry points at exist in comparator/PlanarMaps/: Challenge.lean
    (mathlib-only statements as sorry stubs, module PlanarMaps.Challenge), Solution.lean
    (module PlanarMaps.Solution, import LeanFormalizations), config.json (theorem_names is
    exactly the 6 Headline names listed above) and axiom-audit.lean (one #print
    axioms line per gated theorem). These nine per-group configurations replace the
    former single collection-level config that listed all 53 names at once. This file
    asserts the content of those artifacts and the in-repo axiom audit; the outcome of
    an authoritative leanprover/comparator run is reported by CI
    (.github/workflows/comparator.yml), not by this file.

