# fidelity
fidelity:
  divergences: >
    Statement-level: the cluster is gated by unbundling rather than by importing the
    project structure. The CombinatorialMap structure is restated in Challenge.lean as
    three permutations of a finite dart set with the composition and involution laws,
    its cells as Quotient (Equiv.Perm.SameCycle.setoid ·) counted with Nat.card, and
    Solution.lean reconstructs the structure and bridges the counts through
    Nat.card_eq_fintype_card. Every ingredient is mathlib-typed, so a reviewer reads
    Challenge.lean without trusting a project definition. Modelling choice worth
    naming: planarity here is the Euler-characteristic condition on the combinatorial
    map, not an embedding in the topological plane; no bridge to a topological
    planarity notion is claimed.

# review status
review:
  status: "self-assessed"                            # [required] axiom-clean gate + comparator statement-identity check; no external peer review yet
  reviewers: []
  notes: >
    Self-audit: scripts/check-axioms.sh asserts the repository's headline theorems (these 6
    among them) are axiom-clean. The authoritative external check is a leanprover/comparator
    run verifying statement identity (Challenge ≡ Solution in a shared Headline namespace)
    and axiom compliance, re-running the nanoda and Lean default kernels (CI:
    .github/workflows/comparator.yml; validated locally on Lean v4.30.0 through the default
    kernel). CI (.github/workflows/comparator.yml) runs that check once per group, looping the
    nine configurations so a failure in one group does not hide the others; this file
    does not assert the outcome of any particular run.

# alignment - source statements ↦ formal declarations.
alignment:
  namespace: "CombinatorialMap (comparator restatements under Headline)"
  statements:
    - source: "A connected map has Euler characteristic ≤ 2"
      lean: "CombinatorialMap.eulerCharacteristic_le_two"
      module: "LeanFormalizations.Combinatorics.CombinatorialMap.EulerBound"
      status: "proved"
    - source: "Planar simple-graph edge bound e ≤ 3v − 6"
      lean: "CombinatorialMap.card_edge_le_three_card_vertex_sub_six"
      module: "LeanFormalizations.Combinatorics.CombinatorialMap.PlanarEdgeBound"
      status: "proved"
    - source: "Multiplicity lift of the planar edge bound: e ≤ M·(3v − 6)"
      lean: "planar_multigraph_edge_bound"
      module: "LeanFormalizations.Combinatorics.CombinatorialMap.PlanarEdgeBound"
      status: "proved"
    - source: "Planarity is preserved under duality"
      lean: "CombinatorialMap.dual_isPlanar_iff"
      module: "LeanFormalizations.Combinatorics.CombinatorialMap.DualProperties"
      status: "proved"
    - source: "The dual of a connected map is connected"
      lean: "CombinatorialMap.dual_connected_iff"
      module: "LeanFormalizations.Combinatorics.CombinatorialMap.DualProperties"
      status: "proved"
    - source: "A map with connected dual is connected"
      lean: "CombinatorialMap.connected_dual_iff"
      module: "LeanFormalizations.Combinatorics.CombinatorialMap.DualProperties"
      status: "proved"

# acknowledgements - optional credits for libraries, tools, discussions, etc.
acknowledgements: >
  Built on mathlib4 (leanprover-community) and Lean 4. Auditability packaging follows
  the leanprover/comparator gate and the mathlib-initiative/formalization.yaml standard.

# vendored upstream files in this entry's dependency closure - credited, not authored here.
vendored_dependencies: >
  One vendored upstream file carries this entry: the combinatorial-map carrier
  lean/LeanFormalizations/Combinatorics/CombinatorialMap/Basic.lean, taken from
  mathlib4 PR #16074 "feat: combinatorial maps and planar graphs" at head commit
  2b154fb93c498d33df78f9a0429da9356848e6d7, Apache-2.0, original authors Kyle Miller
  and Rida Hamadani. It carries its original copyright header and is not authored here.
  The definitions three of the six gated theorems are stated over — eulerCharacteristic,
  IsPlanar and dual — are that PR's, not this project's.

  Two facts a reader should have, both now stated in the file's own header. First,
  PR #16074 was opened 2024-08-22 and is still OPEN and unmerged, so this is a vendored
  copy of proposed, not accepted, mathlib code; that is also why it is vendored at all,
  since no released mathlib contains it. The file is meant to be dropped once the
  project bumps to a Mathlib that includes the PR or its successor. Second, the file is
  not a pure copy: five theorems were written for this project after the vendoring —
  facePerm_sameCycle_of_card_face_eq_one and
  card_face_eq_one_of_isPlanar_of_card_edge_eq_card_vertex_sub_one (commit 905d468),
  then Iso.permCongr_facePerm, sameCycle_permCongr_iff and Iso.facePerm_sameCycle_iff
  (commit a56cc8e). They are authored here, not upstream. None of the six gated
  theorems is among them; the gated results are stated over the vendored definitions.
