# fidelity
fidelity:
  divergences: >
    Coverage, not statement, is where this entry stops short of the literature: only
    the reduction layer of Elekes–Sharir and the base layer of the
    Elekes–Sharir–Guth–Katz argument are formalized. The polynomial-partitioning and
    incidence half of Guth–Katz is not formalized, and the separate Pach–Sharir /
    Szemerédi–Trotter incidence route in the repository is still open (8 sorries) and
    underlies none of these claims. The project predicates used by the Esgk statements
    (dist2, esLine, Intersect, Parallel, J, and the Esgk energy/configuration
    predicates) are inlined into the mathlib-only Challenge statements rather than
    imported; docs/skeptic-Challenge-2026-06-20.md records each as read at its
    definition site and matching the inlined expression.

# review status
review:
  status: "self-assessed"                            # [required] axiom-clean gate + comparator statement-identity check; no external peer review yet
  reviewers: []
  notes: >
    Self-audit: scripts/check-axioms.sh asserts the repository's headline theorems (these 19
    among them) are axiom-clean; docs/skeptic-Challenge-2026-06-20.md records a read of the
    inlined ElekesSharir/Esgk definitions against their definition sites. The authoritative
    external check is a leanprover/comparator run verifying statement identity
    (Challenge ≡ Solution in a shared Headline namespace) and axiom compliance, re-running
    the nanoda and Lean default kernels (CI: .github/workflows/comparator.yml; validated
    locally on Lean v4.30.0 through the default kernel). CI (.github/workflows/comparator.yml) runs that check once per group, looping the
    nine configurations so a failure in one group does not hide the others; this file
    does not assert the outcome of any particular run.

# alignment - source statements ↦ formal declarations.
alignment:
  namespace: "ElekesSharir, Esgk (comparator restatements under Headline)"
  statements:
    - source: "Elekes–Sharir rank–nullity for a linear functional"
      lean: "ElekesSharir.finrank_ker_functional_ge"
      module: "LeanFormalizations.Geometry.ElekesSharir.OmegaRankCollapse"
      status: "proved"
    - source: "Kernel dimension ≥ 2 in the three-dimensional case"
      lean: "ElekesSharir.finrank_ker_ge_two_of_finrank_eq_three"
      module: "LeanFormalizations.Geometry.ElekesSharir.OmegaRankCollapse"
      status: "proved"
    - source: "Nondegeneracy of the pullback form"
      lean: "ElekesSharir.pullback_nondegenerate"
      module: "LeanFormalizations.Geometry.ElekesSharir.OmegaRankCollapse"
      status: "proved"
    - source: "Conic normal form: identification of the quadratic part"
      lean: "ElekesSharir.quadraticPart_eq"
      module: "LeanFormalizations.Geometry.ElekesSharir.ConicNormalForm"
      status: "proved"
    - source: "Vanishing criterion for the associated quadratic form"
      lean: "ElekesSharir.dotProduct_mulVec_self_eq_zero_iff"
      module: "LeanFormalizations.Geometry.ElekesSharir.ConicNormalForm"
      status: "proved"
    - source: "Vanishing criterion for the quadratic part"
      lean: "ElekesSharir.quadraticPart_vanishes_iff"
      module: "LeanFormalizations.Geometry.ElekesSharir.ConicNormalForm"
      status: "proved"
    - source: "The two-pinned determinant is affine"
      lean: "ElekesSharir.twoPinnedDet_affine"
      module: "LeanFormalizations.Geometry.ElekesSharir.ChordCurve"
      status: "proved"
    - source: "Two-pinned determinant splits as constant plus linear"
      lean: "ElekesSharir.twoPinnedDet_eq_const_add_linear"
      module: "LeanFormalizations.Geometry.ElekesSharir.ChordCurve"
      status: "proved"
    - source: "Equal squared distances ⟹ the two lines intersect or are parallel"
      lean: "ElekesSharir.intersect_or_parallel_of_dist2_eq"
      module: "LeanFormalizations.Geometry.ElekesSharir.RulingSkewness"
      status: "proved"
    - source: "Isometry-graph form of the intersect-or-parallel dichotomy"
      lean: "ElekesSharir.intersect_or_parallel_of_isometryGraph"
      module: "LeanFormalizations.Geometry.ElekesSharir.RulingSkewness"
      status: "proved"
    - source: "A skew ruling of the isometry graph carries at most one line"
      lean: "ElekesSharir.atMostOneLine_of_skewRuling_isometryGraph"
      module: "LeanFormalizations.Geometry.ElekesSharir.RulingSkewness"
      status: "proved"
    - source: "Cauchy–Schwarz energy lower bound from few distinct distances"
      lean: "Esgk.energy_lower_bound_of_few_distances"
      module: "LeanFormalizations.ElekesSharirGuthKatz.CauchyEnergy"
      status: "proved"
    - source: "Existence of a general-position configuration"
      lean: "Esgk.gp_config_nonempty"
      module: "LeanFormalizations.ElekesSharirGuthKatz.FiniteMinimum"
      status: "proved"
    - source: "Ordered-multiplicity ceiling"
      lean: "Esgk.orderedMultiplicity_le_three_mul"
      module: "LeanFormalizations.ElekesSharirGuthKatz.EnergyCeiling"
      status: "proved"
    - source: "Distance-energy ceiling"
      lean: "Esgk.distanceEnergy_le_three_mul_cube"
      module: "LeanFormalizations.ElekesSharirGuthKatz.EnergyCeiling"
      status: "proved"
    - source: "Distinct-distance count from the energy ceiling"
      lean: "Esgk.numDistances_ge_of_ceiling"
      module: "LeanFormalizations.ElekesSharirGuthKatz.EnergyCeiling"
      status: "proved"
    - source: "Transfer from an all-configurations bound to the h-indexed bound"
      lean: "Esgk.all_configs_lower_bound_to_hIndexed_lower_bound"
      module: "LeanFormalizations.ElekesSharirGuthKatz.FiniteMinimum"
      status: "proved"
    - source: "Level-sum bridge identity for the distance energy"
      lean: "Esgk.distanceEnergy_eq_sum_energyAtLevel"
      module: "LeanFormalizations.ElekesSharirGuthKatz.BridgeIdentity"
      status: "proved"
    - source: "Elekes–Sharir–Guth–Katz base decomposition"
      lean: "Esgk.elekes_sharir_guth_katz_decomposition"
      module: "LeanFormalizations.ElekesSharirGuthKatz.Decomposition"
      status: "proved"

# acknowledgements - optional credits for libraries, tools, discussions, etc.
acknowledgements: >
  Built on mathlib4 (leanprover-community) and Lean 4. Auditability packaging follows
  the leanprover/comparator gate and the mathlib-initiative/formalization.yaml standard.

# vendored upstream files in this entry's dependency closure - credited, not authored here.
vendored_dependencies: >
