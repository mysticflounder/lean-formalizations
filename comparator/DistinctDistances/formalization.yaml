# formalization.yaml (v0.3): per-formalization metadata for one member of the
# lean-formalizations collection. Split out of the repo-root formalization.yaml so
# this formalization can be registered as its own entry.
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.
#
# Markers below ({{NEEDS_ADAM_INPUT}}) flag values that only the project owner can
# fill - the canonical repo URL, per-entry cost figures, and the attribution a
# registry entry should declare where the repository asserts none. Do not treat a
# marker as a fact.

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "lean-formalizations/DistinctDistances"                    # [required]
  authors: ["Adam McKenna"]                         # [required]
  license: "Apache-2.0"                             # [required]
  repo: "https://github.com/AdamMcKenna/lean-formalizations"  # value carried from the repo-root formalization.yaml
  repo_note: >
    {{NEEDS_ADAM_INPUT}} The repo-root formalization.yaml records
    github.com/AdamMcKenna/lean-formalizations; the configured git remote of this
    working copy is github.com/mysticflounder/lean-formalizations. Confirm which URL
    is canonical before registry submission.
  subproject: "DistinctDistances"
  subproject_note: >
    The Elekes–Sharir / Elekes–Sharir–Guth–Katz reduction layer of the
    lean-formalizations collection: 19 of the 53 mathlib-only headline claims packaged
    across the nine per-formalization comparator configurations.

# classification - for registry indexing. arXiv categories and MSC 2020 codes chosen
# to fit this entry's mathematics; short lists are deliberate (no padding).
arxiv_categories: ["math.CO", "math.MG"]
msc2020: ["52C10", "52C35", "15A03"]

# sources - what was formalized.
sources:                                            # [required]
  - title: "Incidences in three dimensions and distinct distances in the plane (the Elekes–Sharir framework)"
    authors: ["György Elekes", "Micha Sharir"]
    id: "arXiv:1005.0982; Combin. Probab. Comput. 20 (2011), no. 4, 571–608; DOI 10.1017/S0963548311000137"
    type: "preprint"
    prior_work: >
      The reduction feeds the Guth–Katz bound (Guth, L. and Katz, N.H., "On the Erdős
      distinct distances problem in the plane", Ann. of Math. 181 (2015), no. 1,
      155–190, DOI 10.4007/annals.2015.181.1.2, arXiv:1011.4105), which README.md cites
      alongside arXiv:1005.0982 for the ElekesSharirGuthKatz base layer. The underlying
      problem is Erdős, P., "On sets of distances of n points", Amer. Math. Monthly 53
      (1946), 248–250, DOI 10.2307/2305092. Only the base reduction layer is formalized
      here; no distinct-distances bound is claimed.

# project status
status:
  scope: >
    The base layer of the Elekes–Sharir reduction of the planar distinct-distances
    problem, in three parts. (1) Linear-algebra core (6): rank–nullity bounds for a
    linear functional and for the three-dimensional case, pullback nondegeneracy, and
    the conic normal-form identities for the quadratic part. (2) Geometric core (5):
    the two-pinned determinant is affine and splits as constant plus linear;
    equal-squared-distance and isometry-graph pairs intersect or are parallel; a skew
    ruling of the isometry graph carries at most one line. (3) Elekes–Sharir–Guth–Katz
    base layer (8): the Cauchy–Schwarz energy lower bound for few distances, existence
    of a general-position configuration, the ordered-multiplicity and distance-energy
    ceilings, the distinct-distance count from the ceiling, the all-configs to
    h-indexed transfer, the level-sum bridge identity, and the assembled decomposition.
    mathlib-only dependencies: no project axioms, no custom axiom, no native_decide,
    no sorry. This is the reduction layer only: the polynomial-partitioning /
    incidence half of Guth–Katz is not formalized, and no distinct-distances lower
    bound is claimed here.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  axioms_note: >
    #print axioms closure of each of the 19 gated results is a subset of
    {propext, Classical.choice, Quot.sound}. The repository's 8 open `sorry`
    declarations are all in the separate Pach–Sharir / Szemerédi–Trotter incidence
    route; none of them is in this formalization or reachable from it.
  theorems:
    - "Headline.finrank_ker_functional_ge"
    - "Headline.finrank_ker_ge_two_of_finrank_eq_three"
    - "Headline.pullback_nondegenerate"
    - "Headline.quadraticPart_eq"
    - "Headline.dotProduct_mulVec_self_eq_zero_iff"
    - "Headline.quadraticPart_vanishes_iff"
    - "Headline.twoPinnedDet_affine"
    - "Headline.twoPinnedDet_eq_const_add_linear"
    - "Headline.intersect_or_parallel_of_dist2_eq"
    - "Headline.intersect_or_parallel_of_isometryGraph"
    - "Headline.atMostOneLine_of_skewRuling_isometryGraph"
    - "Headline.energy_lower_bound_of_few_distances"
    - "Headline.gp_config_nonempty"
    - "Headline.orderedMultiplicity_le_three_mul"
    - "Headline.distanceEnergy_le_three_mul_cube"
    - "Headline.numDistances_ge_of_ceiling"
    - "Headline.all_configs_lower_bound_to_hIndexed_lower_bound"
    - "Headline.distanceEnergy_eq_sum_energyAtLevel"
    - "Headline.elekes_sharir_guth_katz_decomposition"
  main_results:
  - declaration: "19 mathlib-only headline claims (see status.theorems)"
    file: "comparator/DistinctDistances/Solution.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/DistinctDistances/config.json"
    literature_dependencies: ["Elekes–Sharir, arXiv:1005.0982"]
  - declaration: "ElekesSharir linear-algebra core (finrank_ker_functional_ge, finrank_ker_ge_two_of_finrank_eq_three, pullback_nondegenerate, quadraticPart_eq, dotProduct_mulVec_self_eq_zero_iff, quadraticPart_vanishes_iff)"
    file: "lean/LeanFormalizations/Geometry/ElekesSharir/"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/DistinctDistances/config.json"
  - declaration: "ElekesSharir geometric core (twoPinnedDet_affine, twoPinnedDet_eq_const_add_linear, intersect_or_parallel_of_dist2_eq, intersect_or_parallel_of_isometryGraph, atMostOneLine_of_skewRuling_isometryGraph)"
    file: "lean/LeanFormalizations/Geometry/ElekesSharir/"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/DistinctDistances/config.json"
  - declaration: "Esgk base layer (energy_lower_bound_of_few_distances, gp_config_nonempty, orderedMultiplicity_le_three_mul, distanceEnergy_le_three_mul_cube, numDistances_ge_of_ceiling, all_configs_lower_bound_to_hIndexed_lower_bound, distanceEnergy_eq_sum_energyAtLevel, elekes_sharir_guth_katz_decomposition)"
    file: "lean/LeanFormalizations/ElekesSharirGuthKatz/"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/DistinctDistances/config.json"
  gate_note: >
    The artifacts this entry points at exist in comparator/DistinctDistances/: Challenge.lean
    (mathlib-only statements as sorry stubs, module DistinctDistances.Challenge), Solution.lean
    (module DistinctDistances.Solution, import LeanFormalizations), config.json (theorem_names is
    exactly the 19 Headline names listed above) and axiom-audit.lean (one #print
    axioms line per gated theorem). These nine per-group configurations replace the
    former single collection-level config that listed all 53 names at once. This file
    asserts the content of those artifacts and the in-repo axiom audit; the outcome of
    an authoritative leanprover/comparator run is reported by CI
    (.github/workflows/comparator.yml), not by this file.

