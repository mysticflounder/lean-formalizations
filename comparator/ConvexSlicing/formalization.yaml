# fidelity
fidelity:
  divergences: >
    The five slicing and polygon claims are stated mathlib-only (Convex, StrictConvex,
    IsPreconnected, Set.OrdConnected, frontier, Collinear ℝ) with no project definition
    in the statement. The Dumitrescu isosceles bound is gated by inlining: the project
    definitions iCount, IsoscelesPairsAt, ConvexIndep and the minimum-enclosing-circle
    hypothesis are unfolded into a mathlib-only statement in Challenge.lean rather than
    imported. The in-repo review (docs/skeptic-Challenge-2026-06-20.md) records each
    inlined definition as read at its definition site and matching the inlined
    expression. The polygon cyclic-interval claim carries an explicit
    maximal-flat-side hypothesis and is stated for the project's concrete
    simple-convex-polygon model, not for all convex polygons.

# review status
review:
  status: "self-assessed"                            # [required] axiom-clean gate + comparator statement-identity check; no external peer review yet
  reviewers: []
  notes: >
    Self-audit: scripts/check-axioms.sh asserts the repository's headline theorems (these 6
    among them) are axiom-clean; docs/skeptic-Challenge-2026-06-20.md records a read of the
    inlined isosceles-counting definitions against their definition sites. The authoritative
    external check is a leanprover/comparator run verifying statement identity
    (Challenge ≡ Solution in a shared Headline namespace) and axiom compliance, re-running
    the nanoda and Lean default kernels (CI: .github/workflows/comparator.yml; validated
    locally on Lean v4.30.0 through the default kernel). CI (.github/workflows/comparator.yml) runs that check once per group, looping the
    nine configurations so a failure in one group does not hide the others; this file
    does not assert the outcome of any particular run.

# alignment - source statements ↦ formal declarations.
alignment:
  namespace: "(root namespace, SimpleConvexPolygon, IsoscelesCounting; comparator restatements under Headline)"
  statements:
    - source: "A line meets a convex set in a preconnected set"
      lean: "_root_.convex_line_intersection_isPreconnected"
      module: "LeanFormalizations.Geometry.Convex.LineSlice"
      status: "proved"
    - source: "A strictly convex set has no three collinear frontier points"
      lean: "_root_.strictlyConvex_boundary_no_three_collinear"
      module: "LeanFormalizations.Geometry.Convex.LineSlice"
      status: "proved"
    - source: "The convex slice of a line is order-connected after transport to ℝ"
      lean: "_root_.convex_line_slice_ordConnected"
      module: "LeanFormalizations.Geometry.Convex.LineSlice"
      status: "proved"
    - source: "A collinear boundary triple forces the spanning chord into the frontier"
      lean: "_root_.chord_in_frontier_of_collinear_boundary_triple"
      module: "LeanFormalizations.Geometry.Convex.SimpleConvexPolygon"
      status: "proved"
    - source: "Three collinear boundary vertices of a simple convex polygon are cyclically consecutive"
      lean: "SimpleConvexPolygon.collinear_vertices_cyclicInterval"
      module: "LeanFormalizations.Geometry.Convex.SimpleConvexPolygon"
      status: "proved"
    - source: "Dumitrescu (2006) isosceles-triangle count bound for a convex point set, eq. (5): I(P) ≤ (11n²−18n)/12"
      lean: "IsoscelesCounting.iCount_le_of_convexIndep_circumscribed"
      module: "LeanFormalizations.Geometry.IsoscelesCounting.CGN.CGN8"
      status: "proved"

