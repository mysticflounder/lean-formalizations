# formalization.yaml (v0.3): per-formalization metadata for one member of the
# lean-formalizations collection. Split out of the repo-root formalization.yaml so
# this formalization can be registered as its own entry.
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.
#
# Markers below ({{NEEDS_ADAM_INPUT}}) flag values that only the project owner can
# fill - the canonical repo URL, per-entry cost figures, and the attribution a
# registry entry should declare where the repository asserts none. Do not treat a
# marker as a fact.

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "lean-formalizations/ConvexSlicing"                    # [required]
  authors: ["Adam McKenna"]                         # [required]
  license: "Apache-2.0"                             # [required]
  repo: "https://github.com/AdamMcKenna/lean-formalizations"  # value carried from the repo-root formalization.yaml
  repo_note: >
    {{NEEDS_ADAM_INPUT}} The repo-root formalization.yaml records
    github.com/AdamMcKenna/lean-formalizations; the configured git remote of this
    working copy is github.com/mysticflounder/lean-formalizations. Confirm which URL
    is canonical before registry submission.
  subproject: "ConvexSlicing"
  subproject_note: >
    The convex-slicing / convex-polygon cluster of the lean-formalizations collection,
    including Dumitrescu's isosceles-triangle count bound: 6 of the 53 mathlib-only
    headline claims packaged across the nine per-formalization comparator
    configurations.

# classification - for registry indexing. arXiv categories and MSC 2020 codes chosen
# to fit this entry's mathematics; short lists are deliberate (no padding).
arxiv_categories: ["math.MG", "math.CO"]
msc2020: ["52A10", "52A20", "52C10"]

# sources - what was formalized.
sources:                                            # [required]
  - title: "On Distinct Distances from a Vertex of a Convex Polygon"
    authors: ["Adrian Dumitrescu"]
    id: "Discrete Comput. Geom. 36 (2006), no. 4, 503–509; DOI 10.1007/s00454-006-1262-y"
    type: "article"
    note: >
      Source of the isosceles-triangle count bound I(P) ≤ (11n²−18n)/12 for a convex
      point set — eq. (5) of the paper (its headline result is the per-vertex
      distinct-distance bound). The IsoscelesCounting cluster formalizes the
      cap-decomposition proof of that bound; no new quantitative bound is claimed.
      Later improved by Nivasch–Pach–Pinchasi–Zerbib, J. Comput. Geom. 4 (2013),
      arXiv:1207.1266.
  - title: "Convex slicing and strict convexity: classical / folklore, no originating paper asserted"
    authors: []
    id: null
    type: "folklore"
    note: >
      The five slicing / polygon lemmas (a line meets a convex set in an
      interval-shaped slice; a strictly convex set has no three collinear frontier
      points; the chord and cyclic-interval facts) are standard convex analysis. The
      repository asserts no single originating paper for them and points instead at
      general references — Rockafellar, R.T., Convex Analysis, Princeton University
      Press, 1970, and Schneider, R., Convex Bodies: The Brunn–Minkowski Theory, 2nd
      ed., Cambridge University Press, 2014 — without attributing the specific results
      to either. No citation is invented here.

# project status
status:
  scope: >
    Convex slicing and convex-polygon structure, plus the Dumitrescu isosceles count.
    (1) A line meets a convex set in a preconnected, hence interval-shaped, slice, and
    that slice is OrdConnected after transport to ℝ. (2) A strictly convex set has no
    three collinear frontier points, and a collinear boundary triple forces the
    spanning chord into the frontier. (3) In a simple-convex-polygon model, three
    collinear boundary vertices occur cyclically consecutively. (4) Dumitrescu's bound
    I(P) ≤ (11n²−18n)/12 on the apex-isosceles-triangle count of a convex-independent
    set, via a minimum-enclosing-circle cap decomposition. mathlib-only dependencies:
    no project axioms, no custom axiom, no native_decide, no sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  axioms_note: >
    #print axioms closure of each of the 6 gated results is a subset of
    {propext, Classical.choice, Quot.sound}. The repository's 8 open `sorry`
    declarations are all in the separate Pach–Sharir / Szemerédi–Trotter incidence
    route; none of them is in this formalization or reachable from it.
  theorems:
    - "Headline.convex_line_intersection_isPreconnected"
    - "Headline.strictlyConvex_boundary_no_three_collinear"
    - "Headline.chord_in_frontier_of_collinear_boundary_triple"
    - "Headline.convex_line_slice_ordConnected"
    - "Headline.collinear_vertices_cyclicInterval"
    - "Headline.iCount_le_of_convexIndep_circumscribed"
  main_results:
  - declaration: "6 mathlib-only headline claims (see status.theorems)"
    file: "comparator/ConvexSlicing/Solution.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/ConvexSlicing/config.json"
    literature_dependencies: ["Dumitrescu, Discrete Comput. Geom. 36 (2006) 503–509, eq. (5)"]
  - declaration: "convex_line_intersection_isPreconnected, strictlyConvex_boundary_no_three_collinear, convex_line_slice_ordConnected"
    file: "lean/LeanFormalizations/Geometry/Convex/LineSlice.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/ConvexSlicing/config.json"
  - declaration: "chord_in_frontier_of_collinear_boundary_triple, SimpleConvexPolygon.collinear_vertices_cyclicInterval"
    file: "lean/LeanFormalizations/Geometry/Convex/SimpleConvexPolygon.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/ConvexSlicing/config.json"
  - declaration: "IsoscelesCounting.iCount_le_of_convexIndep_circumscribed (alias CGN8_circumscribed_iCount_upper_bound)"
    file: "lean/LeanFormalizations/Geometry/IsoscelesCounting/CGN/CGN8.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/ConvexSlicing/config.json"
    literature_dependencies: ["Dumitrescu, Discrete Comput. Geom. 36 (2006) 503–509, eq. (5)"]
  gate_note: >
    The artifacts this entry points at exist in comparator/ConvexSlicing/: Challenge.lean
    (mathlib-only statements as sorry stubs, module ConvexSlicing.Challenge), Solution.lean
    (module ConvexSlicing.Solution, import LeanFormalizations), config.json (theorem_names is
    exactly the 6 Headline names listed above) and axiom-audit.lean (one #print
    axioms line per gated theorem). These nine per-group configurations replace the
    former single collection-level config that listed all 53 names at once. This file
    asserts the content of those artifacts and the in-repo axiom audit; the outcome of
    an authoritative leanprover/comparator run is reported by CI
    (.github/workflows/comparator.yml), not by this file.

