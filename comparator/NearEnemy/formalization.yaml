# formalization.yaml (v0.3): per-formalization metadata for one member of the
# lean-formalizations collection. Split out of the repo-root formalization.yaml so
# this formalization can be registered as its own entry.
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.
#
# Markers below ({{NEEDS_ADAM_INPUT}}) flag values that only the project owner can
# fill - the canonical repo URL, per-entry cost figures, and the attribution a
# registry entry should declare where the repository asserts none. Do not treat a
# marker as a fact.

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "lean-formalizations/NearEnemy"                    # [required]
  authors: ["Adam McKenna"]                         # [required]
  license: "Apache-2.0"                             # [required]
  repo: "https://github.com/AdamMcKenna/lean-formalizations"  # value carried from the repo-root formalization.yaml
  repo_note: >
    {{NEEDS_ADAM_INPUT}} The repo-root formalization.yaml records
    github.com/AdamMcKenna/lean-formalizations; the configured git remote of this
    working copy is github.com/mysticflounder/lean-formalizations. Confirm which URL
    is canonical before registry submission.
  subproject: "NearEnemy"
  subproject_note: >
    The bisector-energy / Near Enemy cluster of the lean-formalizations collection: 4 of
    the 53 mathlib-only headline claims packaged across the nine per-formalization
    comparator configurations.

# classification - for registry indexing. arXiv categories and MSC 2020 codes chosen
# to fit this entry's mathematics; short lists are deliberate (no padding).
arxiv_categories: ["math.MG", "math.CO"]
msc2020: ["52C10", "51M04"]

# sources - what was formalized.
# The repo-root formalization.yaml attributes no source to this cluster. The entries
# below are the notion-level sources recorded in README.md ("Euclidean geometry"
# references, verified there against publisher pages); no citation is invented, and no
# source below is claimed to state the formalized theorems.
sources:                                            # [required]
  - title: "Original result of this project (the Near Enemy Theorem for bisector energy); no prior source states it"
    authors: ["Adam McKenna"]
    id: null
    type: "original"
    note: >
      README.md records the Near Enemy Theorem as an original result of this project.
      The two existence results gated here are that theorem's noThreeCollinear and
      sphereSlice forms; the bisector-energy floor and its equality case are its
      supporting inequalities. No external paper is claimed to prove them.
  - title: "Bisector energy and few distinct distances (source of the bisector-energy notion)"
    authors: ["Ben Lund", "Adam Sheffer", "Frank de Zeeuw"]
    id: "arXiv:1411.6868; Discrete Comput. Geom. 56 (2016), no. 2, 337–356; DOI 10.1007/s00454-016-9783-5"
    type: "preprint"
    note: >
      Source of the bisector-energy notion that the Near Enemy Theorem minimizes. They
      use it for upper bounds; the minimization direction is this project's.
  - title: "The grid revisited (source of the near-enemy set and the sphere-slice construction)"
    authors: ["Paul Erdős", "Zoltán Füredi", "János Pach", "Imre Z. Ruzsa"]
    id: "Discrete Math. 111 (1993), no. 1–3, 189–196; DOI 10.1016/0012-365X(93)90155-M"
    type: "article"
    note: >
      Source of the lattice-sphere slice and its generic planar projection — the
      configuration the sphereSlice corollary is stated about.
  - title: "{{NEEDS_ADAM_INPUT}} intended registry attribution"
    authors: []
    id: null
    type: "marker"
    note: >
      The repo-root formalization.yaml declares no source for this cluster. The three
      entries above are carried from README.md. Confirm which of them (if any) should
      appear as the registry entry's declared source, given that the theorems
      themselves are original to this project.

# project status
status:
  scope: >
    Bisector energy of a finite planar point set, and the Near Enemy Theorem stated
    over it. (1) The exact floor 2·(number of unordered pairs) ≤ bisector energy.
    (2) The equality case under injectivity of the perpendicular-bisector map on
    pairs. (3)+(4) Two existence results: every finite set in a Euclidean space with
    no three collinear points, and every sphere-slice configuration, admits one
    injective planar projection whose image attains the bisector-energy floor with
    absolute minimality, is in full planar general position, has zero rotational
    energy, and has its distances in bijection with the upstairs ±difference classes.
    mathlib-only dependencies: no project axioms, no custom axiom, no native_decide,
    no sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  axioms_note: >
    #print axioms closure of each of the 4 gated results is a subset of
    {propext, Classical.choice, Quot.sound}. The repository's 8 open `sorry`
    declarations are all in the separate Pach–Sharir / Szemerédi–Trotter incidence
    route; none of them is in this formalization or reachable from it.
  theorems:
    - "Headline.two_mul_pairCount_le_bisectorEnergy"
    - "Headline.bisectorEnergy_eq_of_bisectorInjective"
    - "Headline.nearEnemy_noThreeCollinear_exists_bisectorEnergy_minimal_image_generalPosition_distanceTransport"
    - "Headline.nearEnemy_sphereSlice_exists_bisectorEnergy_minimal_image_generalPosition_distanceTransport"
  main_results:
  - declaration: "4 mathlib-only headline claims (see status.theorems)"
    file: "comparator/NearEnemy/Solution.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/NearEnemy/config.json"
    literature_dependencies: []
  - declaration: "NearEnemy.two_mul_pairCount_le_bisectorEnergy, NearEnemy.bisectorEnergy_eq_of_bisectorInjective, and the two nearEnemy_* distance-transport existence results"
    file: "lean/LeanFormalizations/Geometry/Euclidean/NearEnemyTheorem.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/NearEnemy/config.json"
  gate_note: >
    The artifacts this entry points at exist in comparator/NearEnemy/: Challenge.lean
    (mathlib-only statements as sorry stubs, module NearEnemy.Challenge), Solution.lean
    (module NearEnemy.Solution, import LeanFormalizations), config.json (theorem_names is
    exactly the 4 Headline names listed above) and axiom-audit.lean (one #print
    axioms line per gated theorem). These nine per-group configurations replace the
    former single collection-level config that listed all 53 names at once. This file
    asserts the content of those artifacts and the in-repo axiom audit; the outcome of
    an authoritative leanprover/comparator run is reported by CI
    (.github/workflows/comparator.yml), not by this file.

