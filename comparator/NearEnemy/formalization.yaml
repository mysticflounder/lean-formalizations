# fidelity
fidelity:
  divergences: >
    No prior statement to diverge from: the two existence results are original to this
    project, and the two inequalities are its supporting steps. Gating is by inlining:
    the project definitions perpBisector, bisectorEnergy, rotationEnergy and
    BisectorInjectiveOnPairs are unfolded into mathlib-only statements in
    Challenge.lean rather than imported; the in-repo equivalence survey
    (docs/mathlib-only-equivalence-survey-2026-06-19.md) records those unfoldings as
    closing by rfl, and docs/skeptic-Challenge-2026-06-20.md records each definition as
    read at its definition site. Points of care recorded there: the distance-transport
    conclusion is the full biconditional dist(Ta,Tb) = dist(Tc,Te) ↔ a − b = ±(c − e),
    the bisector-energy conclusion is the exact floor 2n(n−1) rather than an
    inequality, and the empty-configuration case is standard degenerate satisfaction.

# review status
review:
  status: "self-assessed"                            # [required] axiom-clean gate + comparator statement-identity check; no external peer review yet
  reviewers: []
  notes: >
    Self-audit: scripts/check-axioms.sh asserts the repository's headline theorems (these 4
    among them) are axiom-clean; docs/skeptic-Challenge-2026-06-20.md records an adversarial
    read of these four Challenge statements against their project originals. The
    authoritative external check is a leanprover/comparator run verifying statement identity
    (Challenge ≡ Solution in a shared Headline namespace) and axiom compliance, re-running
    the nanoda and Lean default kernels (CI: .github/workflows/comparator.yml; validated
    locally on Lean v4.30.0 through the default kernel). CI (.github/workflows/comparator.yml) runs that check once per group, looping the
    nine configurations so a failure in one group does not hide the others; this file
    does not assert the outcome of any particular run. No external peer review
    of the mathematics has taken place.

# alignment - source statements ↦ formal declarations.
alignment:
  namespace: "NearEnemy (comparator restatements under Headline)"
  statements:
    - source: "Bisector-energy floor: 2·(unordered pair count) ≤ bisector energy"
      lean: "NearEnemy.two_mul_pairCount_le_bisectorEnergy"
      module: "LeanFormalizations.Geometry.Euclidean.NearEnemyTheorem"
      status: "proved"
    - source: "Equality case of the floor under bisector injectivity on pairs"
      lean: "NearEnemy.bisectorEnergy_eq_of_bisectorInjective"
      module: "LeanFormalizations.Geometry.Euclidean.NearEnemyTheorem"
      status: "proved"
    - source: "Near Enemy Theorem, no-three-collinear form (projection attaining the floor, in general position, zero rotation energy, distance transport)"
      lean: "NearEnemy.nearEnemy_noThreeCollinear_exists_bisectorEnergy_minimal_image_generalPosition_distanceTransport"
      module: "LeanFormalizations.Geometry.Euclidean.NearEnemyTheorem"
      status: "proved"
    - source: "Near Enemy Theorem, sphere-slice form"
      lean: "NearEnemy.nearEnemy_sphereSlice_exists_bisectorEnergy_minimal_image_generalPosition_distanceTransport"
      module: "LeanFormalizations.Geometry.Euclidean.NearEnemyTheorem"
      status: "proved"

# acknowledgements - optional credits for libraries, tools, discussions, etc.
acknowledgements: >
  Built on mathlib4 (leanprover-community) and Lean 4. Auditability packaging follows
  the leanprover/comparator gate and the mathlib-initiative/formalization.yaml standard.
