# formalization.yaml (v0.3): per-formalization metadata for one member of the
# lean-formalizations collection. Split out of the repo-root formalization.yaml so
# this formalization can be registered as its own entry.
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.
#
# Markers below ({{NEEDS_ADAM_INPUT}}) flag values that only the project owner can
# fill - per-entry cost figures. The canonical repo URL and the source attribution
# were both settled on 2026-08-31 and are no longer marked. Do not treat a marker as
# a fact.

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "lean-formalizations/TreeOrder"                    # [required]
  authors: ["Adam McKenna"]                         # [required]
  license: "Apache-2.0"                             # [required]
  repo: "https://github.com/mysticflounder/lean-formalizations"  # verified against the configured git remote, 2026-08-31
  subproject: "TreeOrder"
  subproject_note: >
    The finite-tree leaf-order cluster of the lean-formalizations collection: 3 of the
    53 mathlib-only headline claims packaged across the nine per-formalization
    comparator configurations.

# classification - for registry indexing. arXiv categories and MSC 2020 codes chosen
# to fit this entry's mathematics; short lists are deliberate (no padding).
arxiv_categories: ["math.CO"]
msc2020: ["05C05", "05C40"]

# sources - what was formalized.
sources:                                            # [required]
  - title: "Elementary finite-graph facts: classical, no originating paper"
    authors: []
    id: null
    type: "folklore"
    note: >
      All three are textbook finite-graph facts. Every finite tree admits a
      leaf-insertion order (standard leaf-peeling, reversed); each prefix of such an
      order induces a connected subgraph; and a labelling constant across every
      adjacency is constant on a connected graph (a short corollary of reachability
      induction). No source is asserted for any of them, and none is invented here.
      The lemmas were written as helpers for a tree-cotree decomposition layer,
      extracted from a separate research program.
    do_not_cite: >
      README.md heads this module with arXiv:1801.00721 (Pach, J. and Tóth, G.,
      "A crossing lemma for multigraphs", Discrete Comput. Geom. 63 (2020) 918–933).
      That is the PROGRAM header for the surrounding work, which CONSUMES these
      helpers. That paper does not state any of the three lemmas, so it must not be
      carried as this entry's source.
    context_only: >
      The tree-cotree layer these helpers serve cites Jeff Erickson, Computational
      Topology, Lecture 10, "Tree-Cotree Decompositions", and Lando, S.K. and
      Zvonkin, A.K., Graphs on Surfaces and Their Applications, §1.3.3,
      Proposition 1.3.16. Both back the spanning-tree/spanning-cotree complement
      theorem, which is a DIFFERENT statement and is not formalized here. Neither
      states the three gated lemmas. Recorded as context, not as a source.
      {{NEEDS_RESEARCH}} The Erickson lecture notes carry no stable identifier in the
      repository (course number, institution, year); a formal bibliographic entry would
      have to be read off the PDF title page.

# project status
status:
  scope: >
    Leaf-removal and leaf-insertion orders for finite trees, and the connectivity
    invariants they carry: existence of a leaf-insertion order on a finite tree, the
    prefix-connectedness invariant (each prefix of a leaf-insertion order induces a
    connected subgraph through its parent edge), and label transport on a connected
    graph (a labelling constant across every adjacency is globally constant).
    mathlib-only dependencies: no project axioms, no custom axiom, no native_decide,
    no sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  axioms_note: >
    #print axioms closure of each of the 3 gated results is a subset of
    {propext, Classical.choice, Quot.sound}. The repository's 8 open `sorry`
    declarations are all in the separate Pach–Sharir / Szemerédi–Trotter incidence
    route; none of them is in this formalization or reachable from it.
  theorems:
    - "Headline.tree_exists_leaf_insertion_order"
    - "Headline.connected_induce_take_of_leaf_insertion_parent"
    - "Headline.connected_apply_eq_of_forall_adj"
  main_results:
  - declaration: "3 mathlib-only headline claims (see status.theorems)"
    file: "comparator/TreeOrder/Solution.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/TreeOrder/config.json"
    literature_dependencies: []
  - declaration: "SimpleGraph.IsTree.exists_leaf_insertion_order, SimpleGraph.connected_induce_take_of_leaf_insertion_parent, SimpleGraph.Connected.apply_eq_of_forall_adj"
    file: "lean/LeanFormalizations/Combinatorics/SimpleGraph/TreeOrder.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/TreeOrder/config.json"
  gate_note: >
    The artifacts this entry points at exist in comparator/TreeOrder/: Challenge.lean
    (mathlib-only statements as sorry stubs, module TreeOrder.Challenge), Solution.lean
    (module TreeOrder.Solution, import LeanFormalizations), config.json (theorem_names is
    exactly the 3 Headline names listed above) and axiom-audit.lean (one #print
    axioms line per gated theorem). These nine per-group configurations replace the
    former single collection-level config that listed all 53 names at once. This file
    asserts the content of those artifacts and the in-repo axiom audit; the outcome of
    an authoritative leanprover/comparator run is reported by CI
    (.github/workflows/comparator.yml), not by this file.

