# fidelity
fidelity:
  divergences: >
    None known for these 3 claims. All are stated mathlib-only over SimpleGraph,
    SimpleGraph.IsTree, SimpleGraph.Connected and List/Finset primitives; no project
    definition appears in the statements. TreeOrder.lean contains further supporting
    lemmas (parent-edge enumeration, leaf-peeling exclusion, prefix label constancy)
    that are not part of this gated set.

# review status
review:
  status: "self-assessed"                            # [required] axiom-clean gate + comparator statement-identity check; no external peer review yet
  reviewers: []
  notes: >
    Self-audit: scripts/check-axioms.sh asserts the repository's headline theorems (these 3
    among them) are axiom-clean. The authoritative external check is a leanprover/comparator
    run verifying statement identity (Challenge ≡ Solution in a shared Headline namespace)
    and axiom compliance, re-running the nanoda and Lean default kernels (CI:
    .github/workflows/comparator.yml; validated locally on Lean v4.30.0 through the default
    kernel). CI (.github/workflows/comparator.yml) runs that check once per group, looping the
    nine configurations so a failure in one group does not hide the others; this file
    does not assert the outcome of any particular run.

# alignment - source statements ↦ formal declarations.
alignment:
  namespace: "SimpleGraph (comparator restatements under Headline)"
  statements:
    - source: "Every finite tree admits a leaf-insertion order"
      lean: "SimpleGraph.IsTree.exists_leaf_insertion_order"
      module: "LeanFormalizations.Combinatorics.SimpleGraph.TreeOrder"
      status: "proved"
    - source: "Prefix connectedness of a leaf-insertion order through the parent edge"
      lean: "SimpleGraph.connected_induce_take_of_leaf_insertion_parent"
      module: "LeanFormalizations.Combinatorics.SimpleGraph.TreeOrder"
      status: "proved"
    - source: "A labelling constant across every adjacency is constant on a connected graph"
      lean: "SimpleGraph.Connected.apply_eq_of_forall_adj"
      module: "LeanFormalizations.Combinatorics.SimpleGraph.TreeOrder"
      status: "proved"

# acknowledgements - optional credits for libraries, tools, discussions, etc.
acknowledgements: >
  Built on mathlib4 (leanprover-community) and Lean 4. Auditability packaging follows
  the leanprover/comparator gate and the mathlib-initiative/formalization.yaml standard.
