# fidelity
fidelity:
  divergences: >
    None known for these 2 claims. Both are stated mathlib-only: ThreeAPFree over a
    real vector space with Collinear ℝ, and Finset cardinalities for the unit-distance
    count. The project's counting definitions (unitForwardNeighborFinset,
    unitPairIndexFinset) are inlined into the mathlib-only Challenge statement rather
    than imported; the in-repo equivalence survey
    (docs/mathlib-only-equivalence-survey-2026-06-19.md) records them as matching the
    inlined expressions.

# review status
review:
  status: "self-assessed"                            # [required] axiom-clean gate + comparator statement-identity check; no external peer review yet
  reviewers: []
  notes: >
    Self-audit: scripts/check-axioms.sh asserts the repository's headline theorems (these 2
    among them) are axiom-clean; docs/skeptic-Challenge-2026-06-20.md records a read of the
    inlined definitions against their definition sites. The authoritative external check is a
    leanprover/comparator run verifying statement identity (Challenge ≡ Solution in a shared
    Headline namespace) and axiom compliance, re-running the nanoda and Lean default kernels
    (CI: .github/workflows/comparator.yml; validated locally on Lean v4.30.0 through the
    default kernel). CI (.github/workflows/comparator.yml) runs that check once per group, looping the
    nine configurations so a failure in one group does not hide the others; this file
    does not assert the outcome of any particular run.

# alignment - source statements ↦ formal declarations.
alignment:
  namespace: "(root namespace; comparator restatements under Headline)"
  statements:
    - source: "No three collinear points ⟹ no nontrivial 3-term arithmetic progression"
      lean: "_root_.threeAPFree_of_forall_not_collinear"
      module: "LeanFormalizations.Combinatorics.Additive.ThreeAPFreeOfNoThreeCollinear"
      status: "proved"
    - source: "Degeneracy bound: forward-neighbour bound k ⟹ at most n·k unit-distance pairs"
      lean: "_root_.unitPairIndexFinset_card_le_mul_of_forward_neighbor_card_le"
      module: "LeanFormalizations.Combinatorics.UnitDistance.Counting"
      status: "proved"

# acknowledgements - optional credits for libraries, tools, discussions, etc.
acknowledgements: >
  Built on mathlib4 (leanprover-community) and Lean 4. Auditability packaging follows
  the leanprover/comparator gate and the mathlib-initiative/formalization.yaml standard.
