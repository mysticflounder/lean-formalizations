# formalization.yaml (v0.3): per-formalization metadata for one member of the
# lean-formalizations collection. Split out of the repo-root formalization.yaml so
# this formalization can be registered as its own entry.
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.
#
# Markers below ({{NEEDS_ADAM_INPUT}}) flag values that only the project owner can
# fill - the canonical repo URL, per-entry cost figures, and the attribution a
# registry entry should declare where the repository asserts none. Do not treat a
# marker as a fact.

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "lean-formalizations/SmallCombinatorics"                    # [required]
  authors: ["Adam McKenna"]                         # [required]
  license: "Apache-2.0"                             # [required]
  repo: "https://github.com/AdamMcKenna/lean-formalizations"  # value carried from the repo-root formalization.yaml
  repo_note: >
    {{NEEDS_ADAM_INPUT}} The repo-root formalization.yaml records
    github.com/AdamMcKenna/lean-formalizations; the configured git remote of this
    working copy is github.com/mysticflounder/lean-formalizations. Confirm which URL
    is canonical before registry submission.
  subproject: "SmallCombinatorics"
  subproject_note: >
    Two standalone discrete-geometry counting lemmas of the lean-formalizations
    collection: 2 of the 53 mathlib-only headline claims packaged across the nine
    per-formalization comparator configurations.

# classification - for registry indexing. arXiv categories and MSC 2020 codes chosen
# to fit this entry's mathematics; short lists are deliberate (no padding).
arxiv_categories: ["math.CO", "math.MG"]
msc2020: ["52C10", "11B25"]

# sources - what was formalized.
sources:                                            # [required]
  - title: "No originating paper asserted: classical / folklore"
    authors: []
    id: null
    type: "folklore"
    note: >
      Neither result is attributed to a source in the repo-root formalization.yaml, and
      no citation is invented here. (1) no-three-collinear ⟹ ThreeAPFree is the
      elementary observation that a + c = 2•b makes b the midpoint of a and c; the
      repository asserts no originating paper. (2) The unit-distance elimination-order
      count is the classical degeneracy argument; README.md records it as having no
      single originating paper, surveyed (but with the specific bound not attributed
      there) in Brass, P., Moser, W. and Pach, J., Research Problems in Discrete
      Geometry, Springer, 2005.
      {{NEEDS_ADAM_INPUT}} If a specific attribution is intended for either lemma for
      registry purposes, supply it; it is not derivable from the repository.

# project status
status:
  scope: >
    Two small, self-contained counting lemmas. (1) In a real vector space, a set with
    no three collinear points is ThreeAPFree — the geometric source of ThreeAPFree
    hypotheses for additive-energy arguments. (2) A forward-neighbour bound k in some
    index order forces at most n·k unordered unit-distance pairs (the degeneracy
    argument for unit distances). mathlib-only dependencies: no project axioms, no
    custom axiom, no native_decide, no sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  axioms_note: >
    #print axioms closure of both gated results is a subset of
    {propext, Classical.choice, Quot.sound}. The repository's 8 open `sorry`
    declarations are all in the separate Pach–Sharir / Szemerédi–Trotter incidence
    route; none of them is in this formalization or reachable from it.
  theorems:
    - "Headline.threeAPFree_of_forall_not_collinear"
    - "Headline.unitPairIndexFinset_card_le_mul_of_forward_neighbor_card_le"
  main_results:
  - declaration: "Headline.threeAPFree_of_forall_not_collinear, Headline.unitPairIndexFinset_card_le_mul_of_forward_neighbor_card_le (2 mathlib-only headline claims)"
    file: "comparator/SmallCombinatorics/Solution.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/SmallCombinatorics/config.json"
    literature_dependencies: []
  - declaration: "_root_.threeAPFree_of_forall_not_collinear"
    file: "lean/LeanFormalizations/Combinatorics/Additive/ThreeAPFreeOfNoThreeCollinear.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/SmallCombinatorics/config.json"
  - declaration: "_root_.unitPairIndexFinset_card_le_mul_of_forward_neighbor_card_le"
    file: "lean/LeanFormalizations/Combinatorics/UnitDistance/Counting.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/SmallCombinatorics/config.json"
  gate_note: >
    The artifacts this entry points at exist in comparator/SmallCombinatorics/: Challenge.lean
    (mathlib-only statements as sorry stubs, module SmallCombinatorics.Challenge), Solution.lean
    (module SmallCombinatorics.Solution, import LeanFormalizations), config.json (theorem_names is
    exactly the 2 Headline names listed above) and axiom-audit.lean (one #print
    axioms line per gated theorem). These nine per-group configurations replace the
    former single collection-level config that listed all 53 names at once. This file
    asserts the content of those artifacts and the in-repo axiom audit; the outcome of
    an authoritative leanprover/comparator run is reported by CI
    (.github/workflows/comparator.yml), not by this file.

