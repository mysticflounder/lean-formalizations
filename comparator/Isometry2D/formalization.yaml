# fidelity
fidelity:
  divergences: >
    None known for these 2 claims. Statements are mathlib-only: Isometry on
    EuclideanSpace ℝ (Fin 2), Set.ncard, Set.Finite. The Mazur–Ulam reduction is used
    inside the proof; the headline statement is the plane-specific count, which the
    repository documents as an elementary folklore corollary rather than as a result of
    the 1932 paper.

# review status
review:
  status: "self-assessed"                            # [required] axiom-clean gate + comparator statement-identity check; no external peer review yet
  reviewers: []
  notes: >
    Self-audit: scripts/check-axioms.sh asserts the repository's headline theorems (these 2
    among them) are axiom-clean. The authoritative external check is a leanprover/comparator
    run verifying statement identity (Challenge ≡ Solution in a shared Headline namespace)
    and axiom compliance, re-running the nanoda and Lean default kernels (CI:
    .github/workflows/comparator.yml; validated locally on Lean v4.30.0 through the default
    kernel). That run has so far been performed on the collection-level config, not on an
    Isometry2D-only config.

# alignment - source statements ↦ formal declarations.
alignment:
  namespace: "EuclideanGeometry (comparator restatements under Headline)"
  statements:
    - source: "2D two-point isometry rigidity (≤ 2 isometries fix a labeled congruent segment)"
      lean: "EuclideanGeometry.twoPoint_isometry_ncard_le_two"
      module: "LeanFormalizations.Geometry.Euclidean.IsometryClassification"
      status: "proved"
    - source: "Finiteness of the two-point-pinned isometry set"
      lean: "EuclideanGeometry.twoPoint_isometry_set_finite"
      module: "LeanFormalizations.Geometry.Euclidean.IsometryClassification"
      status: "proved"

# acknowledgements - optional credits for libraries, tools, discussions, etc.
acknowledgements: >
  Built on mathlib4 (leanprover-community) and Lean 4. Auditability packaging follows
  the leanprover/comparator gate and the mathlib-initiative/formalization.yaml standard.
