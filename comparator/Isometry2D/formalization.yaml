# subscription Claude usage. Totals only — no per-run or path detail.
# IMPORTANT: every figure in this block is a REPO-WIDE total for the whole
# lean-formalizations collection (all nine formalizations plus the open incidence
# route), carried over unchanged from the repo-root formalization.yaml. The session
# logs do not attribute tokens, spend, or wall time to individual formalizations.
# {{NEEDS_ADAM_INPUT}} if the registry requires per-entry cost figures.
automation:                                          # [required]
  figures_scope: "repo-wide totals for the whole lean-formalizations collection, not this entry alone"
  methods:
    - method: "agent"                                # AI agents under human direction
      models: ["claude-opus-4-8"]
      framework: "Claude Code (with agent-smith multi-agent orchestration)"
      tool_setup: >
