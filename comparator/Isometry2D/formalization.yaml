# formalization.yaml (v0.3): per-formalization metadata for one member of the
# lean-formalizations collection. Split out of the repo-root formalization.yaml so
# this formalization can be registered as its own entry.
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.
#
# Markers below ({{NEEDS_ADAM_INPUT}}) flag values that only the project owner can
# fill - per-entry cost figures. The canonical repo URL and the source attribution
# were both settled on 2026-08-31 and are no longer marked. Do not treat a marker as
# a fact.

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "lean-formalizations/Isometry2D"                    # [required]
  authors: ["Adam McKenna"]                         # [required]
  license: "Apache-2.0"                             # [required]
  repo: "https://github.com/mysticflounder/lean-formalizations"  # verified against the configured git remote, 2026-08-31
  subproject: "Isometry2D"
  subproject_note: >
    The 2D two-point isometry classification of the lean-formalizations collection: 2 of
    the 53 mathlib-only headline claims packaged across the nine per-formalization
    comparator configurations.

# classification - for registry indexing. arXiv categories and MSC 2020 codes chosen
# to fit this entry's mathematics; short lists are deliberate (no padding).
arxiv_categories: ["math.MG", "math.FA"]
msc2020: ["51M04", "46B04"]

# sources - what was formalized.
sources:                                            # [required]
  - title: "Sur les transformations isométriques d'espaces vectoriels normés (the Mazur–Ulam theorem)"
    authors: ["Stanisław Mazur", "Stanisław Ulam"]
    id: "C. R. Acad. Sci. Paris 194 (1932), 946–948"
    type: "article"
    note: >
      Mazur–Ulam supplies the reduction of a surjective isometry to its linear part.
      The formalized headline — at most 2 isometries of the Euclidean plane send a
      labeled segment to a congruent labeled segment — is an elementary corollary and
      is folklore: the repository asserts no single originating paper for the count
      itself (see README.md, "Euclidean geometry" references).

# project status
status:
  scope: >
    Two-point-pinned isometries of EuclideanSpace ℝ (Fin 2): for a ≠ b with
    dist a b = dist c d, the set of isometries sending a ↦ c and b ↦ d has ncard ≤ 2,
    and that set is Finite. The proof reduces to the linear part (Mazur–Ulam) and then
    uses a right-angle-rotation argument specific to two dimensions. mathlib-only
    dependencies: no project axioms, no custom axiom, no native_decide, no sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  axioms_note: >
    #print axioms closure of both gated results is a subset of
    {propext, Classical.choice, Quot.sound}. The repository's 8 open `sorry`
    declarations are all in the separate Pach–Sharir / Szemerédi–Trotter incidence
    route; none of them is in this formalization or reachable from it.
  theorems:
    - "Headline.twoPoint_isometry_ncard_le_two"
    - "Headline.twoPoint_isometry_set_finite"
  main_results:
  - declaration: "Headline.twoPoint_isometry_ncard_le_two, Headline.twoPoint_isometry_set_finite (2 mathlib-only headline claims)"
    file: "comparator/Isometry2D/Solution.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/Isometry2D/config.json"
    literature_dependencies: ["Mazur–Ulam, C. R. Acad. Sci. Paris 194 (1932), 946–948 (linear-reduction step)"]
  - declaration: "EuclideanGeometry.twoPoint_isometry_ncard_le_two"
    file: "lean/LeanFormalizations/Geometry/Euclidean/IsometryClassification.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/Isometry2D/config.json"
  gate_note: >
    The artifacts this entry points at exist in comparator/Isometry2D/: Challenge.lean
    (mathlib-only statements as sorry stubs, module Isometry2D.Challenge), Solution.lean
    (module Isometry2D.Solution, import LeanFormalizations), config.json (theorem_names is
    exactly the 2 Headline names listed above) and axiom-audit.lean (one #print
    axioms line per gated theorem). These nine per-group configurations replace the
    former single collection-level config that listed all 53 names at once. This file
    asserts the content of those artifacts and the in-repo axiom audit; the outcome of
    an authoritative leanprover/comparator run is reported by CI
    (.github/workflows/comparator.yml), not by this file.

