# fidelity
fidelity:
  divergences: >
    Coverage, not statement: this entry is the algebraic prerequisite layer of
    arXiv:1308.0177, not its distinct-distances theorem. The incidence half of the
    program is unfinished elsewhere in the repository — the crossing-lemma and
    Pach–Sharir / Szemerédi–Trotter modules hold all 8 of the repository's open
    `sorry` declarations, and the Milnor–Thom / Oleĭnik–Petrovskiĭ component-count
    material is a stated statement-surface only. Neither is in this entry. The Bézout
    predicates used by the gated statements are inlined into the mathlib-only
    Challenge statements rather than imported;
    docs/skeptic-Challenge-2026-06-20.md records them as read at their definition sites.

# review status
review:
  status: "self-assessed"                            # [required] axiom-clean gate + comparator statement-identity check; no external peer review yet
  reviewers: []
  notes: >
    Self-audit: scripts/check-axioms.sh asserts the repository's headline theorems (these 7
    among them) are axiom-clean. The authoritative external check is a leanprover/comparator
    run verifying statement identity (Challenge ≡ Solution in a shared Headline namespace)
    and axiom compliance, re-running the nanoda and Lean default kernels (CI:
    .github/workflows/comparator.yml; validated locally on Lean v4.30.0 through the default
    kernel). CI (.github/workflows/comparator.yml) runs that check once per group, looping the
    nine configurations so a failure in one group does not hide the others; this file
    does not assert the outcome of any particular run.

# alignment - source statements ↦ formal declarations.
alignment:
  namespace: "PachDeZeeuw.Algebraic (comparator restatements under Headline)"
  statements:
    - source: "Root count of a coefficient polynomial is bounded by its total degree"
      lean: "PachDeZeeuw.Algebraic.ncard_coeff_roots_le_totalDegree"
      module: "LeanFormalizations.PachDeZeeuw.AlgebraicPrelim"
      status: "proved"
    - source: "Resultant nonvanishing from relative primality of the primitive curried polynomial"
      lean: "PachDeZeeuw.Algebraic.resultant_ne_zero_of_isRelPrime_primitive_curry"
      module: "LeanFormalizations.PachDeZeeuw.AlgebraicPrelim"
      status: "proved"
    - source: "Resultant nonvanishing from coprimality of a fraction representation"
      lean: "PachDeZeeuw.Algebraic.resultant_ne_zero_of_fraction_coprime"
      module: "LeanFormalizations.PachDeZeeuw.AlgebraicPrelim"
      status: "proved"
    - source: "Fibre cardinality bounded by the larger total degree"
      lean: "PachDeZeeuw.Algebraic.fiber_ncard_le_max_totalDegree"
      module: "LeanFormalizations.PachDeZeeuw.AlgebraicPrelim"
      status: "proved"
    - source: "Non-vertical pair intersection bound, zero-curry setting"
      lean: "PachDeZeeuw.Algebraic.zeroCurry_nonvertical_pair_intersection_bound"
      module: "LeanFormalizations.PachDeZeeuw.AlgebraicPrelim"
      status: "proved"
    - source: "Non-vertical pair intersection bound, coefficient-line setting"
      lean: "PachDeZeeuw.Algebraic.coeffline_nonvertical_pair_intersection_bound"
      module: "LeanFormalizations.PachDeZeeuw.AlgebraicPrelim"
      status: "proved"
    - source: "Finite Bézout intersection bound"
      lean: "PachDeZeeuw.Algebraic.bezout"
      module: "LeanFormalizations.PachDeZeeuw.Bezout"
      status: "proved"

