# formalization.yaml (v0.3): per-formalization metadata for one member of the
# lean-formalizations collection. Split out of the repo-root formalization.yaml so
# this formalization can be registered as its own entry.
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.
#
# Markers below ({{NEEDS_ADAM_INPUT}}) flag values that only the project owner can
# fill - the canonical repo URL, per-entry cost figures, and the attribution a
# registry entry should declare where the repository asserts none. Do not treat a
# marker as a fact.

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "lean-formalizations/PachDeZeeuw"                    # [required]
  authors: ["Adam McKenna"]                         # [required]
  license: "Apache-2.0"                             # [required]
  repo: "https://github.com/AdamMcKenna/lean-formalizations"  # value carried from the repo-root formalization.yaml
  repo_note: >
    {{NEEDS_ADAM_INPUT}} The repo-root formalization.yaml records
    github.com/AdamMcKenna/lean-formalizations; the configured git remote of this
    working copy is github.com/mysticflounder/lean-formalizations. Confirm which URL
    is canonical before registry submission.
  subproject: "PachDeZeeuw"
  subproject_note: >
    The real-algebraic-geometry / Bézout core of the lean-formalizations collection: 7
    of the 53 mathlib-only headline claims packaged across the nine per-formalization
    comparator configurations.

# classification - for registry indexing. arXiv categories and MSC 2020 codes chosen
# to fit this entry's mathematics; short lists are deliberate (no padding).
arxiv_categories: ["math.AG", "math.AC", "math.CO"]
msc2020: ["13P15", "14H50"]

# sources - what was formalized.
sources:                                            # [required]
  - title: "Distinct distances on algebraic curves in the plane"
    authors: ["János Pach", "Frank de Zeeuw"]
    id: "arXiv:1308.0177; Combin. Probab. Comput. 26 (2017), no. 1, 99–117; DOI 10.1017/S0963548316000225"
    type: "preprint"
    note: >
      The algebraic prerequisites of the paper's incidence argument are what is
      formalized here: coefficient-root counting, resultant nonvanishing under
      coprimality, fibre-cardinality bounds, the non-vertical pair intersection
      bounds, and the finite Bézout intersection bound. The paper's own headline
      distinct-distances theorem is not claimed here. A v1 copy is vendored at
      docs/references/PachDeZeeuw_DistancesOnCurves_arxiv_20151031.tex.

# project status
status:
  scope: >
    Real-algebraic-geometry core for the Pach–de Zeeuw incidence program: the number of
    roots of a coefficient polynomial is bounded by its total degree; the resultant is
    nonzero under relative primality of the curried polynomial and under coprimality of
    a fraction representation; a fibre of a polynomial map has cardinality at most the
    larger total degree; two non-vertical curve pairs meet in a bounded number of
    points in the zero-curry and coefficient-line settings; and the finite Bézout
    intersection bound. mathlib-only dependencies: no project axioms, no custom axiom,
    no native_decide, no sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  axioms_note: >
    #print axioms closure of each of the 7 gated results is a subset of
    {propext, Classical.choice, Quot.sound}. The repository's 8 open `sorry`
    declarations sit in a different part of the Pach–de Zeeuw tree — the
    crossing-lemma / Pach–Sharir / Szemerédi–Trotter sub-program
    (PachDeZeeuw/CrossingLemma/*, PachSharir/SzemerediTrotter, ComponentSplit) — and
    none of them is in this formalization or reachable from it.
  theorems:
    - "Headline.ncard_coeff_roots_le_totalDegree"
    - "Headline.resultant_ne_zero_of_isRelPrime_primitive_curry"
    - "Headline.resultant_ne_zero_of_fraction_coprime"
    - "Headline.fiber_ncard_le_max_totalDegree"
    - "Headline.zeroCurry_nonvertical_pair_intersection_bound"
    - "Headline.coeffline_nonvertical_pair_intersection_bound"
    - "Headline.bezout"
  main_results:
  - declaration: "7 mathlib-only headline claims (see status.theorems)"
    file: "comparator/PachDeZeeuw/Solution.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/PachDeZeeuw/config.json"
    literature_dependencies: ["Pach–de Zeeuw, arXiv:1308.0177"]
  - declaration: "PachDeZeeuw.Algebraic.ncard_coeff_roots_le_totalDegree, resultant_ne_zero_of_isRelPrime_primitive_curry, resultant_ne_zero_of_fraction_coprime, fiber_ncard_le_max_totalDegree, zeroCurry_nonvertical_pair_intersection_bound, coeffline_nonvertical_pair_intersection_bound"
    file: "lean/LeanFormalizations/PachDeZeeuw/AlgebraicPrelim.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/PachDeZeeuw/config.json"
  - declaration: "PachDeZeeuw.Algebraic.bezout"
    file: "lean/LeanFormalizations/PachDeZeeuw/Bezout.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "comparator/PachDeZeeuw/config.json"
  gate_note: >
    The artifacts this entry points at exist in comparator/PachDeZeeuw/: Challenge.lean
    (mathlib-only statements as sorry stubs, module PachDeZeeuw.Challenge), Solution.lean
    (module PachDeZeeuw.Solution, import LeanFormalizations), config.json (theorem_names is
    exactly the 7 Headline names listed above) and axiom-audit.lean (one #print
    axioms line per gated theorem). These nine per-group configurations replace the
    former single collection-level config that listed all 53 names at once. This file
    asserts the content of those artifacts and the in-repo axiom audit; the outcome of
    an authoritative leanprover/comparator run is reported by CI
    (.github/workflows/comparator.yml), not by this file.

