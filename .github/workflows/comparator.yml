name: comparator

# Zulip auditability gate for the AI-authored headline results.
#
# Two jobs:
#   conformance — VALIDATED locally. Builds the project + the two comparator
#                 modules (Challenge, Solution) and runs
#                 comparator/check-conformance.sh: both build and every Solution
#                 theorem is axiom-clean (⊆ {propext, Classical.choice,
#                 Quot.sound}). Statement identity is checked by the comparator job.
#   comparator  — the authoritative leanprover/comparator run: statement
#                 identity + axiom compliance + nanoda and Lean default-kernel
#                 re-check, ending in "Your solution is okay!". The comparator is
#                 checked out at the TAG matching this repo's lean-toolchain, so
#                 its bundled lean4export is built against the same Lean as the
#                 project (this resolves the earlier toolchain-pairing concern).
#                 The pairing + default-kernel leg are validated locally (macOS,
#                 fake-landrun dev shim); the real-landrun + nanoda legs run here
#                 on Linux.

on:
  push:
    branches: [main]
    paths:
      - 'comparator/**'
      - 'lean/**'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - '.github/workflows/comparator.yml'
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    name: conformance + axiom audit (validated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch mathlib build cache
        run: lake exe cache get

      - name: Build project + comparator modules
        run: ./lake-build.sh Challenge Solution

      - name: Offline pre-flight (build + axiom audit)
        run: comparator/check-conformance.sh

  comparator:
    name: leanprover/comparator (nanoda + default kernel)
    runs-on: ubuntu-latest
    # Tag-pinned to the project's lean-toolchain; the pairing + default-kernel leg
    # are validated locally. Kept non-blocking until a first green CI run confirms
    # the real-landrun + nanoda legs on the runner; make `required` in branch
    # protection after that.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch mathlib build cache
        run: lake exe cache get

      - name: Pre-build project + comparator modules
        # A pre-built .lake means the comparator does not rebuild Solution.lean,
        # so its guarantee no longer rests on landrun's sandbox (README assumption 6).
        run: ./lake-build.sh Challenge Solution

      - name: Install Rust (for nanoda)
        uses: dtolnay/rust-toolchain@stable

      - name: Build landrun, comparator (+ matched lean4export), and nanoda
        run: |
          set -euo pipefail
          # Clone tools under RUNNER_TEMP so the comparator clone does not collide
          # with this repo's own comparator/ directory.
          # landrun (real sandbox, Linux only) — built from source per the README.
          git clone --depth 1 https://github.com/Zouuup/landrun "$RUNNER_TEMP/landrun"
          ( cd "$RUNNER_TEMP/landrun" && (go build -o landrun ./... || go build -o landrun .) )
          echo "COMPARATOR_LANDRUN=$RUNNER_TEMP/landrun/landrun" >> "$GITHUB_ENV"
          # comparator AT THE TAG matching this repo's lean-toolchain, so its
          # bundled lean4export builds against the SAME Lean as the project.
          TC="$(cut -d: -f2 lean-toolchain)"
          git clone --branch "$TC" https://github.com/leanprover/comparator "$RUNNER_TEMP/cmp"
          ( cd "$RUNNER_TEMP/cmp" && lake build && lake build lean4export )
          echo "COMPARATOR_BIN=$RUNNER_TEMP/cmp/.lake/build/bin/comparator" >> "$GITHUB_ENV"
          echo "COMPARATOR_LEAN4EXPORT=$RUNNER_TEMP/cmp/.lake/packages/lean4export/.lake/build/bin/lean4export" >> "$GITHUB_ENV"
          # nanoda kernel (optional second kernel; config enable_nanoda = true).
          git clone --depth 1 https://github.com/ammkrn/nanoda_lib "$RUNNER_TEMP/nanoda"
          ( cd "$RUNNER_TEMP/nanoda" && cargo build --release )
          echo "COMPARATOR_NANODA=$RUNNER_TEMP/nanoda/target/release/nanoda_bin" >> "$GITHUB_ENV"

      - name: Run comparator on the 19 headline theorems
        run: |
          set -euo pipefail
          # Invoked from the project dir so `lake env` resolves Challenge/Solution.
          lake env "$COMPARATOR_BIN" comparator/config.json
          # Success ends with "Your solution is okay!".
