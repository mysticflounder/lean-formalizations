name = "LeanFormalizations"
version = "0.1.0"
keywords = ["math", "additive-combinatorics", "discrete-geometry", "lean4", "mathlib"]
defaultTargets = ["LeanFormalizations"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "LeanFormalizations"
srcDir = "lean"

# ── Comparator auditability gate (Zulip submission standard) ─────────────────
# Two out-of-tree modules under comparator/ (not in defaultTargets, so the
# normal `lake build` is unaffected). Build them explicitly:
#   lake build Challenge Solution
# Challenge imports Mathlib only and states the 53 headline results as `sorry`
# stubs; Solution imports the project and discharges them with identical
# top-level (bare) names. The leanprover/comparator run checks statement
# identity and axiom cleanliness across the two exports.

[[lean_lib]]
name = "Challenge"
srcDir = "comparator"

[[lean_lib]]
name = "Solution"
srcDir = "comparator"
