name = "LeanFormalizations"
version = "0.1.0"
keywords = ["math", "additive-combinatorics", "discrete-geometry", "lean4", "mathlib"]
defaultTargets = ["LeanFormalizations"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "LeanFormalizations"
srcDir = "lean"

# ── Comparator auditability gate (Zulip submission standard) ─────────────────
# Three out-of-tree modules under comparator/ (not in defaultTargets, so the
# normal `lake build` is unaffected). Build them explicitly:
#   lake build Challenge Solution Conformance
# Challenge imports Mathlib only; Solution imports the project and discharges
# the sorries; Conformance checks statement-identity by proof irrelevance.

[[lean_lib]]
name = "Challenge"
srcDir = "comparator"

[[lean_lib]]
name = "Solution"
srcDir = "comparator"

[[lean_lib]]
name = "Conformance"
srcDir = "comparator"
