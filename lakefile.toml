name = "LeanFormalizations"
version = "0.1.0"
keywords = ["math", "additive-combinatorics", "discrete-geometry", "lean4", "mathlib"]
defaultTargets = ["LeanFormalizations"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "LeanFormalizations"
